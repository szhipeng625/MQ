name: MQ Project Build and Integration Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: cloud-judge-integration
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mq-cloud-judge

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build middleware (compile + keep binary)
        run: |
          rm -rf /tmp/mw-ci-build && mkdir -p /tmp/mw-ci-build
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v /tmp/mw-ci-build:/out -w /src ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends cmake make g++ libssl-dev libmysqlclient-dev libasan8 zstd libzstd-dev
            cmake -B /tmp/b -DCMAKE_BUILD_TYPE=Release -DJSON_INCLUDE=/src/include -DHTTPLIB_INCLUDE=/src/include
            cmake --build /tmp/b --target middleware -j$(nproc)
            test -x /tmp/b/middleware
            cp /tmp/b/middleware /out/
            echo "middleware built: $(stat -c%s /tmp/b/middleware) bytes"
          '

      - name: Build cloud_judge image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test ./cloud_judge

      - name: Start RabbitMQ for integration test
        run: |
          docker run -d --name rabbitmq-cj-test --network host --userns=host --tmpfs /var/lib/rabbitmq:rw,mode=1777 rabbitmq:4.3-management-alpine
          for i in $(seq 1 30); do
            if ss -tln | grep -q ':5672'; then echo "rabbitmq ready after $((i*2))s"; break; fi
            sleep 2
          done
          if ! ss -tln | grep -q ':5672'; then
            echo 'ERROR: rabbitmq failed to listen on 5672' >&2
            docker logs rabbitmq-cj-test 2>&1 | tail -20
            exit 1
          fi

      - name: Start MySQL and import schema
        run: |
          docker run -d --name mysql-cj-test --network host --userns=host -e MYSQL_ROOT_PASSWORD=rootpw -e MYSQL_DATABASE=oj -e MYSQL_USER=oj_user -e MYSQL_PASSWORD=mwtest123 mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 40); do
            if docker exec mysql-cj-test mysqladmin ping -uroot -prootpw >/dev/null 2>&1; then echo "mysql ready after $((i*3))s"; break; fi
            sleep 3
          done
          if ! ss -tln | grep -q ':3306'; then
            echo 'ERROR: mysql failed to listen on 3306' >&2
            docker logs mysql-cj-test 2>&1 | tail -20
            exit 1
          fi
          docker exec -i mysql-cj-test mysql -uoj_user -pmwtest123 oj < "$GITHUB_WORKSPACE/cloud_judge/tests/oj_schema.sql"
          echo 'schema imported'

      - name: Start middleware (reuse compiled binary)
        run: |
          printf '%s\n' '{' '  "http_port": 18899,' '  "use_https": false,' '  "mysql": {"host":"127.0.0.1","port":3306,"user":"oj_user","pass":"mwtest123","db":"oj"},' '  "lsm": {"host":"127.0.0.1","port":6380},' '  "rate_limit": {"max":60,"window":60}' '}' > /tmp/mw-ci-config.json
          docker run -d --name mw-ci-test --network host --userns=host -v /tmp/mw-ci-build/middleware:/app/middleware -v /tmp/mw-ci-config.json:/run-config/config.json ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libssl3 libmysqlclient21 libasan8 zstd libzstd1 ca-certificates curl procps >/dev/null 2>&1
            chmod +x /app/middleware
            /app/middleware /run-config/config.json
          '
          sleep 15
          docker logs mw-ci-test 2>&1 | tail -20
          if ! ss -tln | grep -q ':18899'; then
            echo 'ERROR: middleware failed to listen on 18899' >&2
            exit 1
          fi
          echo 'middleware listening on 18899'

      - name: Run cloud_judge container
        run: |
          docker run -d --name cj-test --network host --userns=host --privileged -e MQ_HOST=127.0.0.1 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          sleep 10
          docker logs cj-test 2>&1 | tail -15

      - name: Run integration test
        run: docker run --rm --network host -e MQ_HOST=127.0.0.1 -v "$GITHUB_WORKSPACE/cloud_judge/tests:/tests:ro" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test python3 /tests/integration_test.py 127.0.0.1

      - name: Login to GHCR and push image
        if: success() && github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Cleanup
        if: always()
        run: |
          docker logs cj-test 2>&1 | tail -30 || true
          docker rm -f cj-test rabbitmq-cj-test 2>/dev/null || true
